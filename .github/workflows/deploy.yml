name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [overcast-release]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Overcast ref/tag to build docs from"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pull-requests: read

env:
  OVERCAST_REPO: overcast-sh/overcast

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      should_deploy: ${{ steps.release.outputs.should_deploy }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      fingerprint: ${{ steps.release.outputs.fingerprint }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Resolve Overcast source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          should_deploy="true"

          if [[ -n "${MANUAL_REF:-}" ]]; then
            source_ref="$MANUAL_REF"
            fingerprint="$source_ref"
          elif [[ -n "${DISPATCH_TAG:-}" ]]; then
            source_ref="$DISPATCH_TAG"
            fingerprint="$source_ref"
          else
            release_json="$(gh api "repos/$OVERCAST_REPO/releases" --jq '.[0]' 2>/dev/null || true)"
            if [[ -z "$release_json" || "$release_json" == "null" ]]; then
              echo "::error::No releases found for $OVERCAST_REPO; cannot resolve a source ref." >&2
              exit 1
            fi

            source_ref="$(jq -r '.tag_name' <<<"$release_json")"
            fingerprint="$(jq -r '[.tag_name, .target_commitish, .published_at, (.id|tostring)] | join("|")' <<<"$release_json")"

            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              previous="$(cat .github/overcast-release.lock 2>/dev/null || true)"
              if [[ "$fingerprint" == "$previous" ]]; then
                should_deploy="false"
              fi
            fi
          fi

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Stop scheduled run when release is unchanged
        if: github.event_name == 'schedule' && steps.release.outputs.should_deploy != 'true'
        run: echo "Tracked Overcast release has not changed; no build or deploy needed."

      - name: Setup Node
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Checkout Overcast source
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OVERCAST_REPO }}
          ref: ${{ steps.release.outputs.source_ref }}
          path: .cache/source/overcast

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        run: npm ci

      - name: Build
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        env:
          OVERCAST_LOCAL_PATH: .cache/source/overcast
          OVERCAST_SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Generate app token for lock commit
        if: github.event_name != 'pull_request' && github.event_name != 'push' && steps.release.outputs.should_deploy == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: overcast-sh
          repositories: website

      - name: Re-checkout with app token
        if: github.event_name != 'pull_request' && github.event_name != 'push' && steps.release.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Record deployed Overcast release
        if: github.event_name != 'pull_request' && github.event_name != 'push' && steps.release.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.release.outputs.fingerprint }}' > .github/overcast-release.lock
          if git diff --quiet -- .github/overcast-release.lock; then
            exit 0
          fi
          git config user.name "overcast-release[bot]"
          git config user.email "4443571+overcast-release[bot]@users.noreply.github.com"
          git add .github/overcast-release.lock
          git commit -m "Record deployed Overcast release [skip deploy]"
          git push

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || needs.build.outputs.should_deploy == 'true')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
