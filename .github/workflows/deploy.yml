name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [overcast-release]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Overcast ref/tag to build docs from"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pull-requests: read

env:
  OVERCAST_REPO: overcast-sh/overcast
  BRANDING_REPO: overcast-sh/branding

jobs:
  # Node's own test runner over src/**/*.test.ts — no browser, no Overcast checkout, no
  # network, so it is the one job that can say a parser is wrong in seconds. Kept separate
  # from `build` for the same reason as brand-drift: a failing unit test should be visible
  # on its own, not buried in a build log.
  unit-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # public/brand, public/fonts and src/styles/brand-tokens.css are vendored copies of
  # overcast-sh/branding. They stay tracked because this workflow never checks out the
  # branding repo to build the site — but a tracked copy of someone else's file rots
  # silently, so flag the drift here instead. Deliberately NOT a dependency of `build`:
  # stale brand assets are a thing to fix, not a reason to stop shipping the site.
  brand-drift:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout branding
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BRANDING_REPO }}
          path: .cache/source/branding

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check vendored brand assets
        env:
          OVERCAST_BRANDING_PATH: .cache/source/branding
        run: npm run content:check

  # The non-docs pages are hand-written, and the shapes this checks for (contrastive
  # "X, not Y" framing, marketing vocabulary, rhetorical questions, US spelling) keep
  # creeping back in. Needs no Overcast checkout: it reads src/pages and src/components
  # only.
  copy-lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint site copy
        run: npm run copy-lint

  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      should_deploy: ${{ steps.release.outputs.should_deploy }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      fingerprint: ${{ steps.release.outputs.fingerprint }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      # The lock file (.github/overcast-release.lock) always holds the
      # `tag|target_commitish|published_at|id` form written below, because that is the only
      # form a scheduled run can compare against (schedule has no DISPATCH_TAG/MANUAL_REF to
      # key off). Every trigger must therefore write that same form: a dispatch-triggered run
      # that recorded a tag-only fingerprint would make the next scheduled run see a
      # mismatch against its full fingerprint and redeploy once for no actual change. So look
      # the release up by tag here too, even though dispatch/repository_dispatch runs always
      # deploy regardless of should_deploy.
      - name: Resolve Overcast source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          should_deploy="true"

          # Looks up a release by tag and prints the full lock fingerprint on stdout.
          # Returns non-zero (nothing printed) if no release matches the tag.
          lookup_fingerprint() {
            local tag="$1"
            local release_json
            release_json="$(gh api "repos/$OVERCAST_REPO/releases/tags/$tag" 2>/dev/null || true)"
            if [[ -z "$release_json" || "$release_json" == "null" ]]; then
              return 1
            fi
            jq -r '[.tag_name, .target_commitish, .published_at, (.id|tostring)] | join("|")' <<<"$release_json"
          }

          if [[ -n "${MANUAL_REF:-}" || -n "${DISPATCH_TAG:-}" ]]; then
            source_ref="${MANUAL_REF:-$DISPATCH_TAG}"
            if ! fingerprint="$(lookup_fingerprint "$source_ref")"; then
              # workflow_dispatch accepts any ref, not just release tags (e.g. a branch or
              # commit for a one-off build), so fall back instead of failing the run.
              echo "::warning::No release found for tag '$source_ref'; recording a tag-only fingerprint. A later scheduled run may redeploy once if '$source_ref' turns out to match a release." >&2
              fingerprint="$source_ref"
            fi
          else
            release_json="$(gh api "repos/$OVERCAST_REPO/releases" --jq '.[0]' 2>/dev/null || true)"
            if [[ -z "$release_json" || "$release_json" == "null" ]]; then
              echo "::error::No releases found for $OVERCAST_REPO; cannot resolve a source ref." >&2
              exit 1
            fi

            source_ref="$(jq -r '.tag_name' <<<"$release_json")"
            fingerprint="$(jq -r '[.tag_name, .target_commitish, .published_at, (.id|tostring)] | join("|")' <<<"$release_json")"

            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              previous="$(cat .github/overcast-release.lock 2>/dev/null || true)"
              if [[ "$fingerprint" == "$previous" ]]; then
                should_deploy="false"
              fi
            fi
          fi

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Stop scheduled run when release is unchanged
        if: github.event_name == 'schedule' && steps.release.outputs.should_deploy != 'true'
        run: echo "Tracked Overcast release has not changed; no build or deploy needed."

      - name: Setup Node
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Checkout Overcast source
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OVERCAST_REPO }}
          ref: ${{ steps.release.outputs.source_ref }}
          path: .cache/source/overcast

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        run: npm ci

      - name: Build
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        env:
          OVERCAST_LOCAL_PATH: .cache/source/overcast
          OVERCAST_SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.release.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Generate app token for lock commit
        if: github.event_name != 'pull_request' && github.event_name != 'push' && steps.release.outputs.should_deploy == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: overcast-sh
          repositories: website

      - name: Re-checkout with app token
        if: github.event_name != 'pull_request' && github.event_name != 'push' && steps.release.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Record deployed Overcast release
        if: github.event_name != 'pull_request' && github.event_name != 'push' && steps.release.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.release.outputs.fingerprint }}' > .github/overcast-release.lock
          if git diff --quiet -- .github/overcast-release.lock; then
            exit 0
          fi
          git config user.name "overcast-release[bot]"
          git config user.email "4443571+overcast-release[bot]@users.noreply.github.com"
          git add .github/overcast-release.lock
          git commit -m "Record deployed Overcast release [skip deploy]"
          git push

  # Re-running failed jobs on a deploy run (rather than starting a fresh run) leaves two
  # `github-pages` artifacts attached to the run, and actions/deploy-pages then refuses with
  # "Multiple artifacts named 'github-pages'". Recovery is a fresh workflow_dispatch with
  # source_ref set to the release tag, not a re-run of the failed run — that's what
  # recovered the alpha.39 deploy (run 33712972882).
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || needs.build.outputs.should_deploy == 'true')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
